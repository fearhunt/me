# Host-level nginx for firhan.id (static files from /var/www/firhan/current).
# Install:  sudo cp deploy/nginx.conf /etc/nginx/sites-available/firhan.conf
#           sudo ln -s /etc/nginx/sites-available/firhan.conf /etc/nginx/sites-enabled/
# One-time server setup:
#   sudo mkdir -p /var/www/firhan/releases && sudo chown -R fearhunt: /var/www/firhan
# TLS (first run, comment out the 443 blocks until the cert exists, then reload):
#   sudo certbot certonly --webroot -w /var/www/certbot -d firhan.id -d www.firhan.id
# Renewal reuses the same webroot, so the port-80 acme location below must stay.

# ───────────────────────── HTTP → HTTPS ─────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name firhan.id www.firhan.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://firhan.id$request_uri;
    }
}

# ───────────────────────── www → apex ─────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.firhan.id;

    ssl_certificate     /etc/letsencrypt/live/firhan.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/firhan.id/privkey.pem;

    return 301 https://firhan.id$request_uri;
}

# ───────────────────────── Site (vite-ssg static) ─────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name firhan.id;

    ssl_certificate     /etc/letsencrypt/live/firhan.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/firhan.id/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/firhan.access.log;
    error_log  /var/log/nginx/firhan.error.log;

    root /var/www/firhan/current;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml image/svg+xml;

    # vite-ssg emits /about -> about.html, not about/index.html.
    # Unknown routes get index.html with a 404 status; the client router renders NotFound.
    error_page 404 =404 /index.html;

    # Hashed build assets: cache forever
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # CV is versioned with ?v=, logos/favicon rarely change
    location ~* ^/(cv|logos)/|^/favicon\.svg$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # HTML must always revalidate so a new release shows immediately
    location / {
        try_files $uri $uri.html $uri/index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
